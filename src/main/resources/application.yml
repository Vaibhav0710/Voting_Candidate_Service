spring:
  application:
    name: candidate-service

  datasource:
    url: ${VOTING_DB_URL}/candidateservice_db
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Consumers read plain JSON; no Java class names in headers
        spring.json.add.type.headers: false
        # Fail fast (5 s, default 60 s) when the broker is down; the change is already committed
        max.block.ms: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

  # prod = JSON logs; add "logstash" to also ship them to ELK
  profiles:
    group:
      prod: json-logs

server:
  port: 8082

# Eureka Client Config
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 0.0 locally: trace ids still appear in logs but nothing is exported; docker-compose sets 1.0
      probability: ${TRACING_SAMPLING:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
