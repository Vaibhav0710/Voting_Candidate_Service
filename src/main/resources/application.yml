spring:
  application:
    name: candidate-service

  datasource:
    url: ${VOTING_DB_URL}/candidateservice_db
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

# Eureka Client Config (Ready for when we enable server)
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION} # 24 hours in ms
