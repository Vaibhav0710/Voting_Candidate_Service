spring:
  application:
    name: candidate-service

  datasource:
    url: ${VOTING_DB_URL}/candidateservice_db
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

# Eureka Client Config (Ready for when we enable server)
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: false # Set to true once Eureka Server is running

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c35e341411ce0429b64e7107a9335730c9d9182fcfed4ad97192a54823a}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms
